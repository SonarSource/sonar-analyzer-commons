name: Build

on:
  schedule:
    # Run every day at 6:00
    - cron: "0 6 * * *"
  push:
    branches:
      - master
      - branch-*
      - dogfood-on-*
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      forceDigicertSign:
        type: boolean
        description: Force DigiCert NuGet signing (test outside master/branch-*; uses DigiCert quota)
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
  queue: ${{ (github.ref_name != github.event.repository.default_branch) && 'single' || 'max' }}

jobs:
  build:
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    outputs:
      # Consumed by the promote-nuget job to promote the matching NuGet build-info.
      build-number: ${{ steps.build-maven.outputs.BUILD_NUMBER }}
      deployed: ${{ steps.build-maven.outputs.deployed }}
    steps:
      - &checkout
        name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup development environment with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Check Mise task and setup behavior
        run: mise run test:tooling
      - name: Configure shared build from Mise
        id: mise-build
        run: mise run ci:configure
      - name: Build with Maven
        id: build-maven
        uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true
          sonar-platform: none
          maven-args: ${{ steps.mise-build.outputs.maven-args }}

      - name: Check Java formatting
        run: mise run lint

      - name: Generate dependency SBOM
        run: mise run sbom

      - name: Check that the build preserved tracked source files
        run: mise run check:source

      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build-maven.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

      # --- NuGet package: DigiCert-sign and publish to the Repox NuGet feed. ---
      # The Maven build only assembles the .nupkg into target/; it is NOT a Maven artifact. These steps sign it
      # and upload it to a NuGet-layout repo so .NET projects can consume it. Only runs when Maven actually deployed.
      # Also runs for workflow_dispatch forceDigicertSign: feature branches only mvn verify (deployed=false)
      # but still produce the nupkg under target/, which is enough to exercise DigiCert before merge.
      - name: Prepare NuGet package
        id: nupkg
        if: ${{ steps.build-maven.outputs.deployed == 'true' || inputs.forceDigicertSign == true }}
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.build-maven.outputs.project-version }}
        run: mise run ci:nuget:prepare

      - name: Setup DigiCert Client Tools
        if: ${{ inputs.forceDigicertSign == true || (steps.build-maven.outputs.deployed == 'true' && github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-'))) }}
        uses: SonarSource/ci-github-actions/code-signing@v2
        with:
          # 7.2 DIGICERTONE keypair fetch returned HTML/non-JSON in CI; use a newer jsign.
          jsign-version: "7.5"
      - name: Sign NuGet package with DigiCert
        if: ${{ inputs.forceDigicertSign == true || (steps.build-maven.outputs.deployed == 'true' && github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-'))) }}
        shell: bash
        env:
          NUPKG_DIR: ${{ steps.nupkg.outputs.dir }}
        run: mise run ci:nuget:sign

      - name: Get QA deployer token
        id: deployer-secrets
        if: steps.build-maven.outputs.deployed == 'true'
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Deploy signed NuGet package to Repox
        if: steps.build-maven.outputs.deployed == 'true'
        shell: bash
        env:
          ARTIFACTORY_ACCESS_TOKEN: ${{ steps.deployer-secrets.outputs.vault && fromJSON(steps.deployer-secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN || '' }}
          BUILD_NUMBER: ${{ steps.build-maven.outputs.BUILD_NUMBER }}
          NUPKG_DIR: ${{ steps.nupkg.outputs.dir }}
          NUPKG_ID: ${{ steps.nupkg.outputs.id }}
          NUPKG_VERSION: ${{ steps.nupkg.outputs.version }}
        run: mise run ci:nuget:deploy

      - name: Deploy npm package to Repox
        if: steps.build-maven.outputs.deployed == 'true'
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build-maven.outputs.BUILD_NUMBER }}
          PROJECT_VERSION: ${{ steps.build-maven.outputs.project-version }}
        run: mise run ci:npm:deploy

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - *checkout
      - name: Setup development environment with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          sonar-platform: next
          artifactory-reader-role: private-reader

  promote:
    needs: [ build, analysis ]
    # Skip on DigiCert-only pre-merge tests (feature-branch dispatch has nothing to promote).
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
      && (inputs.forceDigicertSign != true)
    runs-on: sonar-xs
    name: Promote
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - name: Promote artifacts
        uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  promote-nuget:
    needs: [ build, analysis ]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
      && (needs.build.outputs.deployed == 'true')
    runs-on: sonar-xs
    name: Promote NuGet
    permissions:
      id-token: write
      contents: read
    steps:
      - *checkout
      - name: Install repository tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true
      - name: Get promoter token
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-promoter access_token | PROMOTER_ACCESS_TOKEN;
      - name: Promote NuGet build
        shell: bash
        env:
          PROMOTER_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).PROMOTER_ACCESS_TOKEN }}
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
        run: mise run ci:nuget:promote

  promote-npm:
    needs: [ build, analysis ]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
      && (needs.build.outputs.deployed == 'true')
    runs-on: sonar-xs
    name: Promote npm
    permissions:
      id-token: write
      contents: write
    steps:
      - *checkout
      - name: Promote npm build
        uses: SonarSource/ci-github-actions/promote@v2
        with:
          build-name: ${{ github.event.repository.name }}_npm
          promote-pull-request: true

  notify-build-failure:
    needs: [build, analysis, promote, promote-nuget, promote-npm]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'branch-') || startsWith(github.ref_name, 'dogfood-on-'))
      && contains(needs.*.result, 'failure')
    runs-on: sonar-xs
    name: Notify build failure
    permissions:
      actions: read # lets the action list this run's own jobs via the GitHub API
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-on-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
