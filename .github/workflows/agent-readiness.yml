name: Repository checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [master, 'branch-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check source boundaries, added credentials, and tooling tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ALLOW_LARGE: ${{ contains(github.event.pull_request.labels.*.name, 'large-change-reviewed') }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          python3 scripts/check_sources.py check --base "$BASE_SHA"
          python3 -m unittest discover -s scripts/tests -v
          if [ -n "$PR_TITLE" ]; then
            if [ "$ALLOW_LARGE" = true ]; then
              python3 scripts/repository_checks.py --base "$BASE_SHA" --title "$PR_TITLE" --allow-large
            else
              python3 scripts/repository_checks.py --base "$BASE_SHA" --title "$PR_TITLE"
            fi
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject new high and critical dependency advisories
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
